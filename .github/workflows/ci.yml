name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt
      # Lets the privacy check's tests read a real PDF. Windows runners get pdftotext with Git.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -W ignore::ResourceWarning -m unittest discover -s tools/tests

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pdftotext reads the example PDFs. Without it the check refuses them, since nothing would vouch for their pages.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # The built-in layer only. The denylist stays on the owner's machine, in the pre-push hook.
      - run: python tools/check_public.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
