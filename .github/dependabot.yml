# Monthly, grouped and capped, so updates arrive as one pull request per ecosystem.
# Security updates don't wait for the schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
