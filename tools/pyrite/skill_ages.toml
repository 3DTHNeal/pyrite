# When technologies became usable by anyone outside the people who made them, so a posting asking for more years of
# one than it has existed can be told apart from a real gap. `since` is the earliest fair date: a public release,
# an open-source launch, the paper that started it, or a law coming into force. Earliest on purpose, so a posting
# is only called impossible when it plainly is. A year with no month counts from January.
#
# `match` is a pattern for how postings name it, matched whole-word and in any case. Keep it to names that mean
# only this: "transformer" alone would catch power transformers, and "MCP" a certification.
#
# Your workspace's data/skill-ages.json adds to these. `pyrite skills --research` fills it from the web, and the
# daily run does when [skills] research = true.

[[skill]]
name = "large language models"
match = 'llms?|large language models?|gpt-3|gpt-4|foundation models?'
since = "2019-02"
basis = "OpenAI released the first GPT-2 model in February 2019, and GPT-3's API followed in June 2020"

[[skill]]
name = "prompt engineering"
match = 'prompt engineering|prompt design'
since = "2020-06"
basis = "Prompting as a practice began with GPT-3's API in June 2020"

[[skill]]
name = "AI agents"
match = 'agentic(?: ai| systems?| workflows?| frameworks?)?|ai agents?|llm[- ]based agents?|llm agents?|agent frameworks?|function calling|tool calling'
since = "2021-12"
basis = "WebGPT, a language model that used a web browser as a tool, was published in December 2021, and ReAct and LangChain followed in 2022"

[[skill]]
name = "retrieval-augmented generation"
match = 'retrieval[- ]augmented generation|rag(?: pipelines?| systems?)?'
since = "2020-05"
basis = "The paper that named it came out in May 2020"

[[skill]]
name = "vector databases"
match = 'vector (?:databases?|dbs?|stores?)'
since = "2019-10"
basis = "Milvus, an early open-source vector database, was released in October 2019"

